// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // The repo lives in a OneDrive-synced folder; OneDrive keeps handles on
    // freshly written files, which makes Gradle's clean/dex steps fail with
    // "Unable to delete directory ...". Keep all build outputs outside OneDrive.
    def safeName = (project == rootProject) ? "root" : project.path.substring(1).replace(':', '-')
    layout.buildDirectory.set(new File("${System.properties['user.home']}/.android-builds/influconnect/${safeName}"))
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
